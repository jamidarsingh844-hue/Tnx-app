<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080A12">
<style>
html{color-scheme:dark;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:#080A12}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.appnav{padding:10px max(16px,env(safe-area-inset-left,0px)) 0;font-family:"Inter","Segoe UI",Roboto,system-ui,sans-serif}
.appnav a{display:inline-flex;align-items:center;min-height:44px;color:#67E8F9;text-decoration:none;font-weight:600;font-size:.9rem}
</style>
<title>TNX EDITZ Order Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* TNX EDITZ design system. Midnight black ground, electric purple actions, ice blue highlights. Single dark look, so every colour is set explicitly on :root. Layout: admin lock screen, then summary band, status chips, search and filters, order list that collapses to cards on phones, editor sheet. */
:root {
  --bg: #080A12;
  --surface: #111522;
  --raised: #171C2B;
  --ink: #F5F7FF;
  --muted: #A7B0C5;
  --line: rgba(255,255,255,.10);
  --accent: #8B5CF6;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(139,92,246,.14);
  --ice: #67E8F9;
  --success: #34D399;
  --warn: #FBBF24;
  --danger: #F87171;
  --grad: linear-gradient(135deg, #8B5CF6 0%, #6366F1 100%);
  --glow: 0 6px 24px rgba(139,92,246,.35);
  --s-new-bg: rgba(103,232,249,.14); --s-new-fg: #67E8F9;
  --s-progress-bg: rgba(251,191,36,.14); --s-progress-fg: #FBBF24;
  --s-delivered-bg: rgba(52,211,153,.14); --s-delivered-fg: #34D399;
  --s-cancelled-bg: rgba(248,113,113,.14); --s-cancelled-fg: #F87171;
  --font: "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(60rem 28rem at 50% -8rem, rgba(139,92,246,.20), transparent 70%), radial-gradient(40rem 20rem at 100% 0, rgba(103,232,249,.07), transparent 70%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 68rem; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
.eyebrow { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: var(--ice); margin-bottom: 6px; }
h1 { font-size: 1.9rem; line-height: 1.1; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: .55rem .95rem; font-weight: 600; cursor: pointer; min-height: 44px; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.primary { background: var(--grad); border-color: transparent; color: var(--accent-ink); box-shadow: var(--glow); }
.btn.primary:hover { filter: brightness(1.1); border-color: transparent; }
.btn.danger { color: var(--danger); border-color: rgba(248,113,113,.5); background: rgba(248,113,113,.10); }
.btn.danger:hover { border-color: var(--danger); }
.btn.sm { min-height: 36px; padding: .25rem .7rem; font-size: .82rem; }
.btn.link { border-color: transparent; background: transparent; color: var(--muted); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

/* lock screen */
.lock { max-width: 26rem; margin: 12vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.lock[hidden] { display: none; }
.lock p { margin: 0; color: var(--muted); }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top .today { color: var(--muted); font-size: .85rem; margin-top: 4px; }
.top .btns { display: flex; gap: 8px; flex-wrap: wrap; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
.stat { padding: 12px 14px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .k { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-size: 1.5rem; font-weight: 600; margin-top: 2px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chip { flex: none; display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: .3rem .85rem; font-size: .85rem; font-weight: 500; cursor: pointer; min-height: 40px; }
.chip .n { font-size: .75rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--grad); border-color: transparent; color: var(--accent-ink); box-shadow: var(--glow); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .85; }

.tools { display: flex; gap: 10px; flex-wrap: wrap; }
.tools .search { flex: 1 1 14rem; min-width: 0; }
input[type="text"], input[type="search"], input[type="password"], input[type="url"], input[type="date"], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .5rem .65rem; min-height: 44px;
}
textarea { min-height: 84px; resize: vertical; }
.tools select { width: auto; flex: 0 0 auto; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
.head, .row { display: grid; align-items: center; column-gap: 14px; }
.head { display: none; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "title svc" "no date" "state act"; row-gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--accent-soft); }
.c-no { grid-area: no; display: flex; gap: 8px; align-items: center; font-size: .78rem; color: var(--muted); }
.c-title { grid-area: title; min-width: 0; }
.c-svc { grid-area: svc; justify-self: end; }
.c-date { grid-area: date; justify-self: end; color: var(--muted); font-size: .85rem; }
.c-state { grid-area: state; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.c-act { grid-area: act; justify-self: end; }
.ttl { font-weight: 600; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: .65rem; letter-spacing: .06em; text-transform: uppercase; border: 1px dashed var(--muted); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.svc { display: inline-block; font-size: .78rem; font-weight: 600; border: 1px solid rgba(139,92,246,.5); background: var(--accent-soft); color: #C4B0FF; border-radius: 6px; padding: .1rem .55rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: .15rem .6rem; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--pbg); color: var(--pfg); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-new { --pbg: var(--s-new-bg); --pfg: var(--s-new-fg); }
.st-progress { --pbg: var(--s-progress-bg); --pfg: var(--s-progress-fg); }
.st-delivered { --pbg: var(--s-delivered-bg); --pfg: var(--s-delivered-fg); }
.st-cancelled { --pbg: var(--s-cancelled-bg); --pfg: var(--s-cancelled-fg); }
.late { color: var(--danger); font-weight: 600; }

.state-msg { padding: 36px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.state-msg strong { color: var(--ink); font-size: 1.15rem; }
.foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: .8rem; align-items: center; }

@media (min-width: 760px) {
  .head, .row { grid-template-columns: 6rem minmax(0, 2fr) 7rem 8.5rem 5.5rem 9rem; }
  .head { display: grid; }
  .row { grid-template-areas: "no title svc state date act"; padding: 11px 16px; }
  .c-svc, .c-date { justify-self: start; }
}

dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--raised); color: var(--ink); width: min(40rem, calc(100% - 1rem)); max-height: calc(100dvh - 1.5rem); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
dialog::backdrop { background: rgba(4, 5, 10, .72); }
.sheet { padding: 18px max(16px, 20px) 0; }
.sheet h2 { font-size: 1.4rem; margin: 0 0 14px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sheet h2 .num { font-size: .85rem; color: var(--muted); font-weight: 400; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; margin-bottom: 12px; }
.field > label, .lock label { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
details.paste { margin-bottom: 14px; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; }
details.paste[hidden] { display: none; }
details.paste summary { cursor: pointer; color: var(--ice); font-weight: 600; min-height: 28px; }
details.paste .inner { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; align-items: flex-start; }
.err { color: var(--danger); font-size: .9rem; min-height: 1.2em; margin: 0 0 8px; }
.actions { position: sticky; bottom: 0; background: var(--raised); border-top: 1px solid var(--line); padding: 12px max(16px, 20px) 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions .grow { flex: 1; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--raised); border: 1px solid var(--ice); color: var(--ink); padding: .55rem 1rem; border-radius: 8px; font-size: .85rem; z-index: 100; max-width: calc(100% - 32px); }
#toast[hidden] { display: none; }
@media (max-width: 520px) { .grid2 { grid-template-columns: minmax(0, 1fr); gap: 0; } }
@media (prefers-reduced-motion: no-preference) { .row, .chip, .btn { transition: background .12s, border-color .12s; } }
</style>
</head>
<body>
<nav class="appnav"><a href="index.html">&larr; TNX EDITZ home</a></nav>
<!-- Admin lock -->
<form class="lock" id="lock" novalidate>
  <div>
    <div class="eyebrow">TNX EDITZ</div>
    <h1>Admin access</h1>
  </div>
  <p>Enter the admin code to open the order dashboard.</p>
  <div class="field" style="margin:0">
    <label for="code">Admin code</label>
    <input id="code" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false">
  </div>
  <p class="err" id="lockErr" role="alert"></p>
  <button class="btn primary" type="submit">Unlock dashboard</button>
</form>

<!-- Dashboard -->
<div class="app" id="app" hidden>
  <header class="top">
    <div>
      <div class="eyebrow">TNX EDITZ</div>
      <h1>Order Desk</h1>
      <div class="today" id="today"></div>
    </div>
    <div class="btns">
      <button class="btn" id="lockBtn" type="button">Lock</button>
      <button class="btn primary" id="newBtn" type="button">+ New order</button>
    </div>
  </header>

  <section class="stats" aria-label="Summary">
    <div class="stat"><div class="k">New</div><div class="v num" id="stNew">0</div></div>
    <div class="stat"><div class="k">In progress</div><div class="v num" id="stProg">0</div></div>
    <div class="stat"><div class="k">Delivered</div><div class="v num" id="stDone">0</div></div>
  </section>

  <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>

  <div class="tools">
    <input class="search" id="search" type="search" placeholder="Search title, customer, contact or details" aria-label="Search orders">
    <select id="svcFilter" aria-label="Filter by service"></select>
    <select id="sort" aria-label="Sort orders">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="deadline">Deadline soonest</option>
    </select>
  </div>

  <section class="list" aria-live="polite">
    <div class="head"><div>Order</div><div>Project</div><div>Service</div><div>Status</div><div>Date</div><div></div></div>
    <div id="rows"></div>
  </section>

  <div class="foot"><span id="count"></span><span id="foot"></span></div>
</div>

<dialog id="editor" aria-labelledby="edTitle">
  <form id="form" novalidate>
    <div class="sheet">
      <h2 id="edTitle">New order <span class="num" id="edNo"></span></h2>
      <details class="paste" id="pasteBox">
        <summary>Fill from the customer's message</summary>
        <div class="inner">
          <textarea id="pasteText" aria-label="Customer message" placeholder="Paste the order message from Instagram here"></textarea>
          <button class="btn sm" id="pasteBtn" type="button">Fill the form</button>
        </div>
      </details>
      <div class="grid2">
        <div class="field"><label for="fTitle">Project title</label><input id="fTitle" type="text" autocomplete="off"></div>
        <div class="field"><label for="fService">Service</label><select id="fService"></select></div>
        <div class="field"><label for="fCustomer">Customer name</label><input id="fCustomer" type="text" autocomplete="off"></div>
        <div class="field"><label for="fContact">Contact (Instagram or phone)</label><input id="fContact" type="text" autocomplete="off"></div>
        <div class="field"><label for="fDate">Order date</label><input id="fDate" type="date"></div>
        <div class="field"><label for="fDeadline">Deadline</label><input id="fDeadline" type="date"></div>
        <div class="field"><label for="fStatus">Status</label><select id="fStatus"></select></div>
        <div class="field"><label for="fLink">Reference link</label><input id="fLink" type="url" placeholder="https://" autocomplete="off"></div>
      </div>
      <div class="field"><label for="fDetails">Details</label><textarea id="fDetails" placeholder="What the customer wants, style, text, timestamps, music"></textarea></div>
      <p class="err" id="formErr" role="alert"></p>
    </div>
    <div class="actions">
      <button class="btn primary" type="submit" id="saveBtn">Save order</button>
      <button class="btn" type="button" id="cancelBtn">Cancel</button>
      <span class="grow"></span>
      <button class="btn danger" type="button" id="delBtn" hidden>Delete order</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>

<script>
(function () {
  var SERVICES = ["Banner", "Video edit", "Thumbnail", "Logo", "Reel / Short", "Poster", "Other"];
  var STATUSES = [
    { id: "new", label: "New" }, { id: "progress", label: "In progress" },
    { id: "delivered", label: "Delivered" }, { id: "cancelled", label: "Cancelled" }
  ];
  var STATUS = {}; STATUSES.forEach(function (s) { STATUS[s.id] = s; });
  var NEXT = { "new": ["progress", "Start work"], progress: ["delivered", "Mark delivered"] };
  var LOCK_HASH = 3524625328996341, LOCK_KEY = "tnxeditz.admin";

  /* Light lock only: the real protection is that this page is private and only an owner or editor can read the order data. */
  function cyrb53(str, seed) {
    seed = seed || 0; var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (var i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }
  function codeOk(c) { return cyrb53("tnx-editz:" + c.trim().toUpperCase()) === LOCK_HASH; }

  var orders = [], ready = false, canWrite = true, mode = "pending", started = false;
  var filter = "all", svcFilter = "all", query = "", sortBy = "newest", editingId = null;
  var db = null;

  function $(id) { return document.getElementById(id); }
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.indexOf("on") === 0) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else if (v !== false && v != null) el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i]; if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  function fmtDate(d) {
    if (!d) return "";
    var dt = new Date(d + "T00:00:00");
    return isNaN(dt) ? d : dt.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  }
  function todayISO() { return new Date().toLocaleDateString("en-CA"); }
  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }

  /* ---------- lock ---------- */
  function unlocked() { try { return localStorage.getItem(LOCK_KEY) === "1"; } catch (e) { return false; } }
  function showApp(on) {
    $("lock").hidden = on; $("app").hidden = !on;
    if (on && !started) { started = true; start(); }
    if (on) render();
  }
  $("lock").addEventListener("submit", function (e) {
    e.preventDefault();
    if (codeOk($("code").value)) {
      try { localStorage.setItem(LOCK_KEY, "1"); } catch (x) {}
      $("code").value = ""; $("lockErr").textContent = ""; showApp(true);
    } else {
      $("lockErr").textContent = "That code is not correct. Check it and try again."; $("code").select();
    }
  });
  $("lockBtn").addEventListener("click", function () {
    try { localStorage.removeItem(LOCK_KEY); } catch (e) {}
    showApp(false); $("code").focus();
  });

  /* ---------- storage: shared db when available, this browser otherwise ---------- */
  function persistLocal() { try { localStorage.setItem("tnxeditz.orders", JSON.stringify(orders)); } catch (e) {} }
  function stripId(o) { var c = {}; Object.keys(o).forEach(function (k) { if (k !== "id") c[k] = o[k]; }); return c; }
  var store = {
    save: function (o) {
      if (db) return db.collection("orders").doc(o.id).set(stripId(o));
      var i = orders.findIndex(function (x) { return x.id === o.id; });
      if (i >= 0) orders[i] = o; else orders.push(o);
      persistLocal(); render(); return Promise.resolve();
    },
    remove: function (id) {
      if (db) return db.collection("orders").doc(id).delete();
      orders = orders.filter(function (x) { return x.id !== id; });
      persistLocal(); render(); return Promise.resolve();
    },
    removeMany: function (ids) {
      return ids.reduce(function (p, id) { return p.then(function () { return store.remove(id); }); }, Promise.resolve());
    }
  };
  function writeFailed(e) {
    var code = e && e.code;
    if (code === "invalid_argument") { canWrite = false; render(); toast("You can view orders but not change them."); }
    else if (code === "quota_exceeded") toast("Storage is full. Delete some orders first.");
    else toast("Could not save. Try again.");
  }
  async function start() {
    render();
    try {
      var claude = window.claude;
      if (claude && claude.use) {
        var d = await claude.use("db");
        if (d) {
          db = d; mode = "db";
          try { var u = await claude.use("user"); if (u && u.can) { var c = await u.can("data.write"); if (c === false) canWrite = false; } } catch (e) {}
          d.collection("orders").onSnapshot(function (snap) {
            orders = snap.docs.map(function (x) { var o = x.data(); o.id = x.id; return o; });
            ready = true; render();
          }, function () { ready = true; render(); });
          return;
        }
      }
    } catch (e) {}
    mode = "local";
    try { var raw = localStorage.getItem("tnxeditz.orders"); if (raw) orders = JSON.parse(raw) || []; } catch (e) {}
    ready = true; render();
  }

  /* ---------- derived data ---------- */
  function visible() {
    var list = orders.slice();
    if (filter !== "all") list = list.filter(function (o) { return o.status === filter; });
    if (svcFilter !== "all") list = list.filter(function (o) { return o.service === svcFilter; });
    var s = query.trim().toLowerCase();
    if (s) list = list.filter(function (o) {
      return ["ord-" + o.no, o.title, o.customer, o.contact, o.details, o.service].join(" ").toLowerCase().indexOf(s) >= 0;
    });
    list.sort(function (a, b) {
      if (sortBy === "deadline") {
        var x = a.deadline || "9999", y = b.deadline || "9999";
        return x === y ? 0 : (x < y ? -1 : 1);
      }
      var da = (a.date || "") + String(a.no).padStart(6, "0"), dbb = (b.date || "") + String(b.no).padStart(6, "0");
      return sortBy === "oldest" ? (da < dbb ? -1 : 1) : (da < dbb ? 1 : -1);
    });
    return list;
  }

  /* ---------- rendering ---------- */
  function rowEl(o) {
    var late = o.deadline && o.deadline < todayISO() && (o.status === "new" || o.status === "progress");
    var sub = (o.customer || "No name") + (o.contact ? " · " + o.contact : "") + (o.deadline ? " · due " + fmtDate(o.deadline) : "");
    var nx = NEXT[o.status];
    return h("div", { class: "row", role: "button", tabindex: "0", "data-id": o.id, "aria-label": "Open order " + o.no + ", " + (o.title || "") },
      h("div", { class: "c-no" }, h("span", { class: "num", text: "ORD-" + o.no }), o.example ? h("span", { class: "tag", text: "Example" }) : null),
      h("div", { class: "c-title" }, h("div", { class: "ttl", text: o.title || "(untitled)" }), h("div", { class: "sub" + (late ? " late" : ""), text: sub + (late ? " · overdue" : "") })),
      h("div", { class: "c-svc" }, h("span", { class: "svc", text: o.service || "Other" })),
      h("div", { class: "c-state" }, h("span", { class: "pill st-" + o.status, text: (STATUS[o.status] || STATUS["new"]).label })),
      h("div", { class: "c-date num", text: fmtDate(o.date) }),
      h("div", { class: "c-act" }, (canWrite && nx) ? h("button", { class: "btn sm", type: "button", text: nx[1],
        onclick: function (e) { e.stopPropagation(); advance(o); } }) : null)
    );
  }

  function render() {
    if ($("app").hidden) return;
    $("today").textContent = new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" });
    $("newBtn").hidden = !canWrite;
    function cnt(s) { return orders.filter(function (o) { return o.status === s; }).length; }
    $("stNew").textContent = cnt("new"); $("stProg").textContent = cnt("progress"); $("stDone").textContent = cnt("delivered");

    var chips = $("chips"); chips.textContent = "";
    [{ id: "all", label: "All" }].concat(STATUSES).forEach(function (s) {
      var n = s.id === "all" ? orders.length : cnt(s.id);
      chips.append(h("button", { class: "chip", type: "button", "aria-pressed": String(filter === s.id),
        onclick: function () { filter = s.id; render(); } }, s.label, h("span", { class: "n num", text: n })));
    });

    var sf = $("svcFilter");
    if (!sf.options.length) {
      sf.append(h("option", { value: "all", text: "All services" }));
      SERVICES.forEach(function (s) { sf.append(h("option", { value: s, text: s })); });
    }

    var rows = $("rows"); rows.textContent = "";
    var list = visible();
    if (!ready) {
      rows.append(h("div", { class: "state-msg", text: "Loading orders…" }));
    } else if (!orders.length) {
      rows.append(h("div", { class: "state-msg" }, h("strong", { text: "No orders yet" }),
        h("span", { text: "New orders appear here. Add one, or paste a customer's message to fill it in." }),
        canWrite ? h("button", { class: "btn primary", type: "button", text: "Add the first order", onclick: function () { openEditor(null); } }) : null));
    } else if (!list.length) {
      rows.append(h("div", { class: "state-msg" }, h("strong", { text: "No matching orders" }),
        h("button", { class: "btn", type: "button", text: "Clear search and filters", onclick: function () {
          filter = "all"; svcFilter = "all"; query = ""; $("search").value = ""; $("svcFilter").value = "all"; render(); } })));
    } else {
      list.forEach(function (o) { rows.append(rowEl(o)); });
    }
    $("count").textContent = ready && orders.length ? "Showing " + list.length + " of " + orders.length : "";

    var foot = $("foot"); foot.textContent = "";
    var exs = orders.filter(function (o) { return o.example; });
    if (canWrite && exs.length) {
      var b = h("button", { class: "btn link sm", type: "button", text: "Remove " + exs.length + " example orders" });
      arm(b, "Remove " + exs.length + " example orders", "Tap again to remove", function () {
        store.removeMany(exs.map(function (o) { return o.id; })).then(function () { toast("Example orders removed"); }, writeFailed);
      });
      foot.append(b);
    } else if (mode === "local") foot.textContent = "Orders are saved in this browser only.";
    else if (!canWrite && ready) foot.textContent = "View only";
  }

  function arm(btn, label, confirmLabel, fn) {
    var timer = null, armed = false;
    btn.addEventListener("click", function () {
      if (!armed) { armed = true; btn.textContent = confirmLabel; timer = setTimeout(function () { armed = false; btn.textContent = label; }, 4000); }
      else { clearTimeout(timer); armed = false; btn.textContent = label; fn(); }
    });
    btn._reset = function () { clearTimeout(timer); armed = false; btn.textContent = label; };
  }
  function advance(o) {
    var nx = NEXT[o.status]; if (!nx) return;
    var c = JSON.parse(JSON.stringify(o)); c.status = nx[0]; delete c.example;
    store.save(c).then(function () { toast("ORD-" + o.no + " is now " + STATUS[nx[0]].label.toLowerCase()); }, writeFailed);
  }

  /* ---------- editor ---------- */
  function fillSelect(sel, opts) { sel.textContent = ""; opts.forEach(function (o) { sel.append(h("option", { value: o.v, text: o.t })); }); }

  function openEditor(id) {
    editingId = id;
    var o = id ? orders.find(function (x) { return x.id === id; }) : null;
    if (id && !o) return;
    fillSelect($("fService"), SERVICES.map(function (s) { return { v: s, t: s }; }));
    fillSelect($("fStatus"), STATUSES.map(function (s) { return { v: s.id, t: s.label }; }));
    $("edTitle").firstChild.nodeValue = o ? "Order " : "New order ";
    $("edNo").textContent = o ? "ORD-" + o.no : "";
    $("fTitle").value = o ? o.title || "" : "";
    $("fService").value = o && SERVICES.indexOf(o.service) >= 0 ? o.service : (o ? "Other" : SERVICES[0]);
    $("fCustomer").value = o ? o.customer || "" : "";
    $("fContact").value = o ? o.contact || "" : "";
    $("fDate").value = o ? o.date || todayISO() : todayISO();
    $("fDeadline").value = o ? o.deadline || "" : "";
    $("fStatus").value = o ? o.status : "new";
    $("fLink").value = o ? o.link || "" : "";
    $("fDetails").value = o ? o.details || "" : "";
    $("pasteText").value = ""; $("pasteBox").open = false; $("pasteBox").hidden = !!o;
    $("formErr").textContent = "";
    $("delBtn").hidden = !o; if ($("delBtn")._reset) $("delBtn")._reset(); $("delBtn").disabled = false;
    $("saveBtn").textContent = o ? "Save changes" : "Save order";
    $("editor").showModal();
    $("fTitle").focus();
  }
  function closeEditor() { var d = $("editor"); if (d.open) d.close(); }

  $("pasteBtn").addEventListener("click", function () {
    var map = {};
    $("pasteText").value.split(/\r?\n/).forEach(function (ln) {
      var m = ln.match(/^\s*([A-Za-z ]+?)\s*:\s*(.*)$/); if (m) map[m[1].toLowerCase()] = m[2].trim();
    });
    var found = 0;
    function put(id, v) { if (v) { $(id).value = v; found++; } }
    var svc = (map["service"] || "").toLowerCase();
    SERVICES.forEach(function (s) { if (s.toLowerCase() === svc) { $("fService").value = s; found++; } });
    put("fTitle", map["project"]); put("fCustomer", map["name"]); put("fContact", map["contact"]);
    put("fLink", map["link"]);
    if (/^\d{4}-\d{2}-\d{2}$/.test(map["deadline"] || "")) { $("fDeadline").value = map["deadline"]; found++; }
    put("fDetails", (map["details"] || "").replace(/\s*\|\s*/g, "\n"));
    $("formErr").textContent = found ? "" : "Could not read that message. Fill the form by hand.";
    if (found) { $("pasteBox").open = false; toast("Form filled. Check it, then save."); }
  });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $("fTitle").value.trim(), customer = $("fCustomer").value.trim(), link = $("fLink").value.trim(), err = "";
    if (!title) err = "Enter a project title.";
    else if (!customer) err = "Enter the customer's name.";
    else if (link && !/^https?:\/\//i.test(link)) err = "The reference link must start with http:// or https://.";
    $("formErr").textContent = err; if (err) return;
    var prev = editingId ? orders.find(function (x) { return x.id === editingId; }) : null;
    var no = prev ? prev.no : orders.reduce(function (m, o) { return Math.max(m, o.no || 0); }, 1000) + 1;
    var rec = {
      id: prev ? prev.id : "o" + Date.now().toString(36), no: no, title: title, service: $("fService").value,
      customer: customer, contact: $("fContact").value.trim(), date: $("fDate").value || todayISO(), deadline: $("fDeadline").value,
      status: $("fStatus").value, link: link, details: $("fDetails").value.trim(),
      createdAt: prev && prev.createdAt ? prev.createdAt : new Date().toISOString()
    };
    $("saveBtn").disabled = true;
    store.save(rec).then(function () { closeEditor(); toast(prev ? "Order updated" : "ORD-" + no + " added"); }, writeFailed)
      .then(function () { $("saveBtn").disabled = false; });
  });

  var delBtn = $("delBtn");
  arm(delBtn, "Delete order", "Tap again to delete", function () {
    var id = editingId; if (!id) return;
    delBtn.disabled = true; delBtn.textContent = "Deleting…"; $("formErr").textContent = "";
    store.remove(id).then(function () { closeEditor(); toast("Order deleted"); }, function (e) {
      $("formErr").textContent = (e && e.code === "invalid_argument")
        ? "You do not have permission to delete this order."
        : "Could not delete the order. Check your connection and try again.";
      writeFailed(e);
    }).then(function () { delBtn.disabled = false; delBtn._reset(); });
  });

  $("cancelBtn").addEventListener("click", closeEditor);
  $("editor").addEventListener("click", function (e) { if (e.target === $("editor")) closeEditor(); });
  $("newBtn").addEventListener("click", function () { openEditor(null); });
  $("rows").addEventListener("click", function (e) { var r = e.target.closest(".row"); if (r && canWrite) openEditor(r.getAttribute("data-id")); });
  $("rows").addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("row")) { e.preventDefault(); if (canWrite) openEditor(e.target.getAttribute("data-id")); }
  });
  $("search").addEventListener("input", function (e) { query = e.target.value; render(); });
  $("sort").addEventListener("change", function (e) { sortBy = e.target.value; render(); });
  $("svcFilter").addEventListener("change", function (e) { svcFilter = e.target.value; render(); });

  showApp(unlocked());
  if (!unlocked()) $("code").focus();
})();
</script>
</body>
</html>
