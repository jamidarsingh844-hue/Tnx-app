name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Create the Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: App icon
        run: npx capacitor-assets generate --android || echo "Icon step skipped"

      - name: Copy the web pages into the app
        run: npx cap sync android

      - name: Build APK for testing
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build bundle for Google Play
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Sign the Play bundle
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - uses: actions/upload-artifact@v4
        with:
          name: TNX-EDITZ-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TNX-EDITZ-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
